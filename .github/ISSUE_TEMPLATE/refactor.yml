name: Refactor
description: "동작 불변 내부 구조 개선"
title: "[Refactor] primary-component: "
labels: ["type:refactor"]
body:
  - type: markdown
    attributes:
      value: |
        제목 형식: `[Refactor] primary-component: 검증 가능한 결과`

        각 필드 안내의 **반려기준**에 걸리면 반려된다. 라벨은 계정 공용
        정책 저장소(`multicg/.github`) `labels.yml` 정의를 그대로 쓴다 —
        `type:refactor` 라벨이 이 폼에서 자동으로 붙는다.
        유형이 아직 정해지지 않은 초안만 General Work 폼을 쓴다.
  - type: input
    id: primary_component
    attributes:
      label: "Primary Component"
      description: "comp:* 라벨 중 하나를 적는다(예: agent, api, ci, core, docs, security, skill 등 — 25종)"
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: "목적"
      description: "작업이 끝난 뒤 무엇이 달라져야 하는가 — 검증 가능한 결과. 반려기준: \"효율화\"·\"고도화\"·\"개선\" 같은 추상명사만 있는 것 / AI 문장을 그대로 붙인 것."
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: "배경"
      description: "선택. 현재 상태, 문제, 작업이 필요한 이유. 실측·로그가 있으면 인용한다."
  - type: textarea
    id: preserved_behavior
    attributes:
      label: "불변 동작"
      description: "바뀌면 안 되는 관찰 가능한 동작·인터페이스를 구체적으로. 반려기준: \"동작은 그대로 유지된다\" / \"동작 유지\"만."
    validations:
      required: true
  - type: textarea
    id: restructuring_scope
    attributes:
      label: "재구성 범위"
      description: "바뀌는 내부 구조 — 구체적 모듈·파일·경계. 반려기준: \"코드를 정리한다\"."
    validations:
      required: true
  - type: textarea
    id: regression_verification
    attributes:
      label: "회귀 검증"
      description: "동작이 안 바뀌었음을 확인하는 구체적 테스트·비교 방법. 반려기준: \"테스트를 통과하면 된다\" / \"테스트한다\"만."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "범위"
      description: "포함/제외 경계를 나눠 적는다. 제외가 없으면 `없음` + 이유. 반려기준: 이유 없는 공란."
      value: |
        ### 포함

        -

        ### 제외

        -
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "완료 조건"
      description: "Pass/Fail로 판정 가능한 조건. 반려기준: \"잘 되게\"·\"안정적으로\" 같은 주관 표현만 있는 것."
    validations:
      required: true
  - type: textarea
    id: subtasks
    attributes:
      label: "하위 Task"
      description: "선택. 브랜치·PR 단위 하위 작업. 규모와 무관하게 분해를 권장한다."
  - type: textarea
    id: related
    attributes:
      label: "관련 항목"
      description: "선택. Parent / Depends-on / Blocks / Related 이슈·PR (#번호 또는 owner/repo#번호)."
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - p0
        - p1
        - p2
        - p3
        - p4
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      options:
        - critical
        - major
        - moderate
        - minor
        - informational
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: "Risk level"
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: textarea
    id: issue_contract
    attributes:
      label: "Issue Contract (JSON)"
      description: "위에서 고른 값(Primary Component/Priority/Severity/Risk)과 완료 조건을 그대로 옮겨 채운다. 사람이 읽는 위 내용과 어긋나면 안 된다 — 자동 검증 CI는 없으므로 작성자가 직접 일치시킨다."
      render: "json"
      value: |
        {
          "schema_version": "1.0.0",
          "title": "[Refactor] primary-component: 검증 가능한 결과",
          "classification": {
            "type": "refactor",
            "primary_component": "",
            "components": []
          },
          "planning": {
            "priority": "",
            "severity": "",
            "risk_level": ""
          },
          "acceptance_criteria": []
        }
    validations:
      required: true
