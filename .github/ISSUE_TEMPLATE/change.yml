name: Change
description: "기존 계약·동작의 변경"
title: "[Change] primary-component: "
labels: ["type:change"]
body:
  - type: markdown
    attributes:
      value: |
        제목 형식: `[Change] primary-component: 검증 가능한 결과`

        각 필드 안내의 **반려기준**에 걸리면 반려된다. 라벨은 계정 공용
        정책 저장소(`multicg/.github`) `labels.yml` 정의를 그대로 쓴다 —
        `type:change` 라벨이 이 폼에서 자동으로 붙는다.
        유형이 아직 정해지지 않은 초안만 General Work 폼을 쓴다.
  - type: input
    id: primary_component
    attributes:
      label: "Primary Component"
      description: "comp:* 라벨 중 하나를 적는다(예: agent, api, ci, core, docs, security, skill 등 — 25종)"
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: "현재 동작"
      description: "바뀌는 기존 계약·동작과 그 근거(코드·스펙·이전 결정) — 특정 인터페이스를 지목한다. 반려기준: \"현재는 다르게 동작한다\" / \"현재 상태\"만."
    validations:
      required: true
  - type: textarea
    id: proposed_behavior
    attributes:
      label: "변경 후 동작"
      description: "변경 뒤 존재할 동작과 현재 동작과의 구체적 차이 — 부정형이 아닌 실체로. 반려기준: \"개선된 방식으로 동작한다\"."
    validations:
      required: true
  - type: textarea
    id: compatibility_impact
    attributes:
      label: "호환성 영향"
      description: "영향 받는 소비자와 breaking / non-breaking 명시. \"영향 없음\"은 이유 필수. 반려기준: 이유 없는 \"호환성에 영향 없음\"."
    validations:
      required: true
  - type: textarea
    id: migration_or_transition
    attributes:
      label: "이행 방안"
      description: "기존 소비자가 새 동작으로 옮겨가는 경로, 또는 불필요한 이유. breaking이면 공란·\"없음\" 불가. 반려기준: \"마이그레이션 필요\"만."
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "완료 조건"
      description: "독립적으로 검증 가능한 완료 조건. 조건마다 관찰 가능한 결과 + 검증 방법. 가능하면 부정/경계 조건 1개 이상. 작성자가 아닌 사람이 판정 가능해야 한다. 반려기준: \"구현한다\"·\"완료한다\"·\"문서를 작성한다\" / 관찰 결과 없이 \"테스트를 통과한다\"로 끝나는 것."
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: "사용 시나리오"
      description: "선택. 주요 사용자·시스템 시나리오."
  - type: textarea
    id: impact
    attributes:
      label: "영향과 제약"
      description: "선택. 호환성, 데이터, API, 보안, 배포 영향."
  - type: textarea
    id: verification
    attributes:
      label: "검증 방법"
      description: "선택. 완료 조건을 무엇으로 확인하는가 — 실행할 명령·확인할 출력·기대 결과."
  - type: textarea
    id: related
    attributes:
      label: "관련 항목"
      description: "선택. Parent / Depends-on / Blocks / Related 이슈·PR (#번호 또는 owner/repo#번호)."
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - p0
        - p1
        - p2
        - p3
        - p4
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      options:
        - critical
        - major
        - moderate
        - minor
        - informational
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: "Risk level"
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: textarea
    id: issue_contract
    attributes:
      label: "Issue Contract (JSON)"
      description: "위에서 고른 값(Primary Component/Priority/Severity/Risk)과 완료 조건을 그대로 옮겨 채운다. 사람이 읽는 위 내용과 어긋나면 안 된다 — 자동 검증 CI는 없으므로 작성자가 직접 일치시킨다."
      render: "json"
      value: |
        {
          "schema_version": "1.0.0",
          "title": "[Change] primary-component: 검증 가능한 결과",
          "classification": {
            "type": "change",
            "primary_component": "",
            "components": []
          },
          "planning": {
            "priority": "",
            "severity": "",
            "risk_level": ""
          },
          "acceptance_criteria": []
        }
    validations:
      required: true
